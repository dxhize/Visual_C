<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 235" role="img" aria-labelledby="t desc"><title id="t">Stage 1 at a glance</title><desc id="desc">C source flows through the Trace Engine, schema-2 JSON, TraceStore, then validated semantic evidence; Stage 2 consumes the qualified results.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657890"/></marker></defs>
<rect width="1120" height="235" rx="16" fill="#fafcff"/>
<text x="24" y="32" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#213a54">Stage 1 at a glance</text>
<rect x="22" y="57" width="194" height="118" rx="11" fill="#eeeeff" stroke="#555a85" stroke-width="1.5"/>
<text x="36" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#555a85">C source &amp; build</text>
<text x="36" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">GCC debug binary</text>
<text x="36" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">optional Clang pass</text>
<path d="M 220 116 H 234" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="57" width="194" height="118" rx="11" fill="#e7f2ff" stroke="#185a97" stroke-width="1.5"/>
<text x="254" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#185a97">Trace Engine</text>
<text x="254" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">GDB/MI + C wrapper</text>
<text x="254" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">DWARF, tool reports</text>
<path d="M 438 116 H 452" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="458" y="57" width="194" height="118" rx="11" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="472" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#825329">Schema-v2 JSON</text>
<text x="472" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Stops, events, gaps</text>
<text x="472" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">partiality recorded</text>
<path d="M 656 116 H 670" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="676" y="57" width="194" height="118" rx="11" fill="#e8f6ee" stroke="#306451" stroke-width="1.5"/>
<text x="690" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#306451">Trace Parser</text>
<text x="690" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Arc + indexes</text>
<text x="690" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">validate once, page</text>
<path d="M 874 116 H 888" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="894" y="57" width="194" height="118" rx="11" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="908" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#8b4146">Future Stage 2</text>
<text x="908" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Qualify and explain</text>
<text x="908" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">never invent origin</text>
<text x="24" y="213" font-family="system-ui,sans-serif" font-size="12" fill="#44566b">Blue: engine  ·  Green: parser  ·  Amber: evidence  ·  Red: partial/unknown  ·  Purple: source</text></svg>
