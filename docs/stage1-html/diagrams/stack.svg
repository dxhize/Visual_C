<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902 235" role="img" aria-labelledby="t desc"><title id="t">Frames and variable observations</title><desc id="desc">A stop contains a frame-zero variable vector, optional bounded caller frame vectors, a separate global vector, and separately budgeted raw bytes.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657890"/></marker></defs>
<rect width="902" height="235" rx="16" fill="#fafcff"/>
<text x="24" y="32" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#213a54">Frames and variable observations</text>
<rect x="22" y="57" width="194" height="118" rx="11" fill="#e7f2ff" stroke="#185a97" stroke-width="1.5"/>
<text x="36" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#185a97">Observed stop</text>
<text x="36" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">PC, thread, PID</text>
<text x="36" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">stop ID</text>
<path d="M 220 116 H 234" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="57" width="194" height="118" rx="11" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="254" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#825329">Frame 0</text>
<text x="254" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">variables + activation</text>
<text x="254" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">scope and value</text>
<path d="M 438 116 H 452" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="458" y="57" width="194" height="118" rx="11" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="472" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#825329">Caller frames</text>
<text x="472" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">optional, bounded</text>
<text x="472" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">distinct activations</text>
<path d="M 656 116 H 670" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="676" y="57" width="194" height="118" rx="11" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="690" y="86" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#825329">Globals + bytes</text>
<text x="690" y="110" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">observation.globals</text>
<text x="690" y="127" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">captured ≠ initialized</text>
<text x="24" y="213" font-family="system-ui,sans-serif" font-size="12" fill="#44566b">Blue: engine  ·  Green: parser  ·  Amber: evidence  ·  Red: partial/unknown  ·  Purple: source</text></svg>
