<text x="255" y="171" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#555a85">__wrap_realloc</text>
<rect x="465" y="50" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="475" y="76" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">Failure: old alive</text>
