<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 420" role="img" aria-labelledby="t desc"><title id="t">Realloc outcomes and lifetime links</title><desc id="desc">A failed realloc keeps its old block alive. Same-address success can retain a lifetime; moved success closes predecessor and creates successor with explicit old ID. Terminal realloc(ptr,0) may free without creating a successor.</desc>
