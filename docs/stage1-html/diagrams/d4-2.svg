<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t desc"><title id="t">Walkthrough 2: recursion and activations</title><desc id="desc">GDB reports nested recurse frames. The engine assigns activation IDs, captures caller frames with a configured depth, and the parser exposes frame-scoped variables without merging recursive activations.</desc>
