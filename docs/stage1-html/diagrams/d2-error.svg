<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 400" role="img" aria-labelledby="t desc"><title id="t">Failure and retained evidence paths</title><desc id="desc">Compiler failure yields a trace without debugger stops. GDB timeout or step cap can preserve partial observations. Missing ACK lowers heap completeness; export cap fails output without claiming a valid JSON document.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657890"/></marker></defs>
<rect width="1090" height="400" rx="16" fill="#fafcff"/>
<text x="24" y="32" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#213a54">Failure and retained evidence paths</text>
<path d="M 212 115 L 680 115" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 435 115 L 680 115" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 555 155 L 555 250" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 605 250 L 725 155" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 870 115 L 875 115" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 970 155 L 970 250" stroke="#657890" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="22" y="75" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="32" y="101" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">Compilation failure</text>
<rect x="245" y="75" width="190" height="80" rx="10" fill="#e7f2ff" stroke="#185a97" stroke-width="1.5"/>
<text x="255" y="101" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#185a97">GDB stop/limit</text>
<rect x="460" y="75" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="470" y="101" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">Heap ACK/transport</text>
<rect x="680" y="75" width="190" height="80" rx="10" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="690" y="101" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#825329">Partial/failed trace</text>
<rect x="875" y="75" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="885" y="101" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">JSON export cap</text>
<rect x="460" y="250" width="190" height="80" rx="10" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="470" y="276" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#825329">Coverage/status</text>
<rect x="875" y="250" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="885" y="276" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">No successful JSON</text>
<text x="24" y="380" font-family="system-ui,sans-serif" font-size="12" fill="#44566b">Solid: observed/control/data transfer · Dashed: independent, candidate or conceptual (see caption)</text></svg>
