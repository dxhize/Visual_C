<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="t desc"><title id="t">Schema gate after deserialization</title><desc id="desc">serde checks the model shape first, then validate_schema_version accepts only version 2. A malformed model is a syntax error; a valid model with another version is a schema error.</desc>
