<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 565" role="img" aria-labelledby="t desc"><title id="t">Production tools and the Stage 1 boundary</title><desc id="desc">GCC builds a debug binary; GDB observes it while an allocation wrapper writes a separate file. Clang syntax, Valgrind and sanitizer diagnostics are optional or independent. The engine emits schema-2 JSON to the parser and borrowed consumer views.</desc>
