<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="t desc"><title id="t">Parser identity domains</title><desc id="desc">Vector position, event ID, attempted position, GDB stop, snapshot index, allocation ID, activation ID and static metadata IDs are distinct. EvidenceRef adds owner identity; address equality is not allocation identity.</desc>
