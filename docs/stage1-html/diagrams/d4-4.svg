<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t desc"><title id="t">Walkthrough 4: free, reuse and realloc</title><desc id="desc">Free closes a lifetime; a later allocation at the same address receives a new ID; realloc can be in-place, moved, failed or terminal-free. TP8-F01 requires recorded corroboration for predecessor links.</desc>
