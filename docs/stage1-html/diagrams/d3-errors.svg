<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 420" role="img" aria-labelledby="t desc"><title id="t">Ingestion and query error classes</title><desc id="desc">TraceParseError covers input and schema failures. QueryError covers range, reference, foreign owner, unavailable evidence, page limit and ordering. Partial execution is recorded data, not ingestion failure.</desc>
