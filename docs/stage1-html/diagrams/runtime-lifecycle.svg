<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 806" role="img" aria-labelledby="t desc"><title id="t">Typical engine recording lifecycle</title><desc id="desc">After configuration the engine compiles and starts GDB; stopped-state capture and heap collection repeat under budgets; separate diagnostics run conditionally; DWARF association, evidence fusion and final JSON export complete the trace.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657890"/></marker></defs>
<rect width="780" height="806" rx="16" fill="#fafcff"/>
<text x="24" y="32" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#213a54">Typical engine recording lifecycle</text>
<rect x="55" y="50" width="666" height="70" rx="11" fill="#eeeeff" stroke="#555a85" stroke-width="1.5"/>
<text x="69" y="79" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#555a85">Configuration and deadline</text>
<text x="69" y="103" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">cli.to_config → trace_program / supervisor</text>
<path d="M 388 121 V 139" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="148" width="666" height="70" rx="11" fill="#e7f2ff" stroke="#185a97" stroke-width="1.5"/>
<text x="69" y="177" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#185a97">GCC compilation and instrumentation</text>
<text x="69" y="201" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Debug binary + C wrapper; optional sanitizer binary</text>
<path d="M 388 219 V 237" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="246" width="666" height="70" rx="11" fill="#eeeeff" stroke="#555a85" stroke-width="1.5"/>
<text x="69" y="275" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#555a85">Static metadata and GDB setup</text>
<text x="69" y="299" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">DWARF extraction; optional Clang; launch MI session</text>
<path d="M 388 317 V 335" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="344" width="666" height="70" rx="11" fill="#e7f2ff" stroke="#185a97" stroke-width="1.5"/>
<text x="69" y="373" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#185a97">Stop loop and event transport</text>
<text x="69" y="397" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Snapshots, instruction attempts, heap event file</text>
<path d="M 388 415 V 433" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="442" width="666" height="70" rx="11" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="69" y="471" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#8b4146">Conditional independent diagnostics</text>
<text x="69" y="495" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Valgrind / sanitizer separate executions</text>
<path d="M 388 513 V 531" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="540" width="666" height="70" rx="11" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="69" y="569" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#825329">Heap lifetimes, associations, fusion</text>
<text x="69" y="593" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Reconcile existing records, preserve gaps</text>
<path d="M 388 611 V 629" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="638" width="666" height="70" rx="11" fill="#e8f6ee" stroke="#306451" stroke-width="1.5"/>
<text x="69" y="667" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#306451">Final trace and JSON export</text>
<text x="69" y="691" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Stage results; output cap is per document</text>
<text x="24" y="784" font-family="system-ui,sans-serif" font-size="12" fill="#44566b">Blue: engine  ·  Green: parser  ·  Amber: evidence  ·  Red: partial/unknown  ·  Purple: source</text></svg>
