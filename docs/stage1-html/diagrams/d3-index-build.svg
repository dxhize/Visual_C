<text x="69" y="177" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#185a97">TraceIndexes::build</text>
<text x="69" y="201" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">One pass per structure</text>
<path d="M 388 219 V 237" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="246" width="666" height="70" rx="11" fill="#e7f2ff" stroke="#185a97" stroke-width="1.5"/>
<text x="69" y="275" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#185a97">CSR + hash indexes</text>
<text x="69" y="299" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">u32 positions, interned keys</text>
<path d="M 388 317 V 335" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
