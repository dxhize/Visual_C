<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 475" role="img" aria-labelledby="t desc"><title id="t">Trace Parser ownership and query layers</title><desc id="desc">JSON decoder gates schema, then TraceStore owns a canonical Arc and position indexes. Borrowed views and deep validation feed confidence-qualified TP-6 and paged TP-7 consumers; journals are parsed as records separately.</desc>
