<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 450" role="img" aria-labelledby="t desc"><title id="t">Canonical trace ownership</title><desc id="desc">One TraceStore owns Arc DebugSessionTrace and Arc TraceIndexes. Clones share both Arcs. EvidenceRef holds a weak trace identity plus a position; independent loads of equal JSON have different owners.</desc>
