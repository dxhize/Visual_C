<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="t desc"><title id="t">Walkthrough H: partial execution</title><desc id="desc">A crash or limit leaves original records accessible; validation reports partial coverage and confidence is qualified without rejecting the trace.</desc>
