<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" role="img" aria-labelledby="t desc"><title id="t">Evidence confidence classification</title><desc id="desc">Confidence belongs to a relationship. Definite is a recorded fact under scope; Candidate is compatible but incomplete; Ambiguous has multiple matches; Unavailable lacks evidence; Contradictory conflicts or follows structural corruption.</desc>
