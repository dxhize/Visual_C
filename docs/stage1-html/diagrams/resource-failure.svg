<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 490" role="img" aria-labelledby="t desc"><title id="t">Different limits at different boundaries</title><desc id="desc">Whole-session deadline and resource caps constrain the engine; stop-loop, journal and export budgets act separately. Parser input/validation limits and paged consumer errors are different boundaries; missing observations reach consumers as qualified uncertainty.</desc>
