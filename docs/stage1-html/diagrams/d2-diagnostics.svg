<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 450" role="img" aria-labelledby="t desc"><title id="t">Independent diagnostic provider orchestration</title><desc id="desc">After primary GDB recording, Valgrind runs a separate Memcheck process; sanitizer pass may run earlier or later depending on crash trigger and availability. XML and stderr reports are retained separately from the primary execution.</desc>
