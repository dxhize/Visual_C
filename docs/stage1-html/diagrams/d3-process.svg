<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t desc"><title id="t">Heap process coverage decision flow</title><desc id="desc">The parser verifies observed event PIDs and the followed inferior only. Unknown scope, unsupported child claims, PID 0, missing PIDs and complete flags with losses produce distinct findings.</desc>
