<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 420" role="img" aria-labelledby="t desc"><title id="t">Fork child and observed-PID scope</title><desc id="desc">An atfork child callback resets inherited lock and counters, deferring table clearing. Parent and logged child append PID-specific event lines and ACKs. An unlogged silent descendant is not known to the reader.</desc>
