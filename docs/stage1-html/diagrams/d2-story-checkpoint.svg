<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="t desc"><title id="t">Walkthrough B: observed stop to checkpoint</title><desc id="desc">GDB reader parses *stopped asynchronously, run_gdb_phase drains allocation events, captures frame and bounded variables, enriches pointers, and Recorder appends a snapshot and source checkpoint.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657890"/></marker></defs>
<rect width="780" height="512" rx="16" fill="#fafcff"/>
<text x="24" y="32" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#213a54">Walkthrough B: observed stop to checkpoint</text>
<rect x="55" y="50" width="666" height="70" rx="11" fill="#eeeeff" stroke="#555a85" stroke-width="1.5"/>
<text x="69" y="79" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#555a85">MI *stopped</text>
<text x="69" y="103" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Async channel, not ^done acknowledgement</text>
<path d="M 388 121 V 139" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="148" width="666" height="70" rx="11" fill="#e7f2ff" stroke="#185a97" stroke-width="1.5"/>
<text x="69" y="177" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#185a97">run_gdb_phase</text>
<text x="69" y="201" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Drain events; classify frame</text>
<path d="M 388 219 V 237" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="246" width="666" height="70" rx="11" fill="#e7f2ff" stroke="#185a97" stroke-width="1.5"/>
<text x="69" y="275" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#185a97">capture_state / memory reads</text>
<text x="69" y="299" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Scoped values, bytes and errors</text>
<path d="M 388 317 V 335" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="55" y="344" width="666" height="70" rx="11" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="69" y="373" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#825329">Recorder checkpoint</text>
<text x="69" y="397" font-family="system-ui,sans-serif" font-size="12.4" fill="#33465c">Snapshot index, stop ID, gaps</text>
<text x="24" y="490" font-family="system-ui,sans-serif" font-size="12" fill="#44566b">Blue: engine  ·  Green: parser  ·  Amber: evidence  ·  Red: partial/unknown  ·  Purple: source</text></svg>
