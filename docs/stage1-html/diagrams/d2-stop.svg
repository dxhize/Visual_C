<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 435" role="img" aria-labelledby="t desc"><title id="t">Recorded debugger stop-loop choices</title><desc id="desc">At each observed stop, the loop ingests available heap lines before state capture. It chooses source checkpoint or instruction attempt from actual frame origin and mode, advances MI and waits for another stop; deadlines, signals and caps preserve gaps.</desc>
