<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 430" role="img" aria-labelledby="t desc"><title id="t">Temporal association boundaries</title><desc id="desc">Explicit checkpoint tags are definite; heap intervals and gaps are candidate retained-boundary windows; source expressions are static candidates. None is an exact instruction timestamp.</desc>
