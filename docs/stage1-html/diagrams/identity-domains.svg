<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-labelledby="t desc"><title id="t">Distinct identity domains and candidate bridges</title><desc id="desc">TraceStore owner distinguishes equal documents. Snapshot position, stop ID, attempted and retained instruction positions, activation and variable identity, PID and allocation lifetime are separate runtime domains. DWARF and AST IDs are static and source-site matches only candidates.</desc>
