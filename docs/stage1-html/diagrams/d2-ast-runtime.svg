<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 410" role="img" aria-labelledby="t desc"><title id="t">AST syntax is not runtime execution</title><desc id="desc">Clang source expression and GCC DWARF declaration may be linked as candidates through matching CU and source identity. A GDB checkpoint records live observations; a same-line expression alone is not a recorded executed call.</desc>
