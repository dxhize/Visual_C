<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t desc"><title id="t">Validated semantic view construction</title><desc id="desc">validated_semantic runs validate_deep once, stores the report and borrows the store. Queries resolve evidence and attach relationship-specific confidence; they do not revalidate.</desc>
