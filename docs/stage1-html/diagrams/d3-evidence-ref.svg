<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t desc"><title id="t">Evidence reference creation and resolution</title><desc id="desc">evidence_ref validates a location then binds a weak trace identity. resolve_evidence checks Weak ptr_eq before resolving the location. Equal positions in independent stores are foreign; optional reports are unavailable.</desc>
