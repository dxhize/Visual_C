<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 410" role="img" aria-labelledby="t desc"><title id="t">Diagnostic evidence boundaries</title><desc id="desc">Compiler diagnostics, crash, sanitizer and Valgrind reports are separate recorded evidence. A Valgrind source-site candidate never becomes a primary-run allocation ID; reports are session-wide, not causal checkpoint joins.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#657890"/></marker></defs>
<rect width="1060" height="410" rx="16" fill="#fafcff"/>
<text x="24" y="32" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#213a54">Diagnostic evidence boundaries</text>
<path d="M 210 107 L 690 168" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 210 257 L 690 193" stroke="#657890" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 435 113 L 690 162" stroke="#657890" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M 435 270 L 465 270" stroke="#a75d26" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M 655 249 L 875 201" stroke="#657890" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="20" y="55" width="190" height="80" rx="10" fill="#eeeeff" stroke="#555a85" stroke-width="1.5"/>
<text x="30" y="81" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#555a85">Compiler diagnostics</text>
<rect x="20" y="230" width="190" height="80" rx="10" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="30" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#825329">Crash report</text>
<rect x="245" y="55" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="255" y="81" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">Sanitizer report</text>
<rect x="245" y="230" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="255" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">Valgrind report</text>
<rect x="465" y="230" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="475" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">Source-site candidate</text>
<rect x="690" y="140" width="190" height="80" rx="10" fill="#fff3e0" stroke="#825329" stroke-width="1.5"/>
<text x="700" y="166" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#825329">Trace records</text>
<rect x="875" y="140" width="190" height="80" rx="10" fill="#ffeded" stroke="#8b4146" stroke-width="1.5"/>
<text x="885" y="166" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#8b4146">No causal join</text>
<text x="24" y="390" font-family="system-ui,sans-serif" font-size="12" fill="#44566b">Solid: observed/control/data transfer · Dashed: independent, candidate or conceptual (see caption)</text></svg>
