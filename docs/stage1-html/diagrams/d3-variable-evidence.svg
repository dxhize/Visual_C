<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t desc"><title id="t">Variable evidence resolution</title><desc id="desc">A variable reference resolves to a borrowed VariableInfo, then optional DWARF type/declaration and AST declaration lookups run independently. Value, type, declaration and source declaration each receive their own confidence.</desc>
