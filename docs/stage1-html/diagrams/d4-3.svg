<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t desc"><title id="t">Walkthrough 3: malloc to lifetime</title><desc id="desc">Linked --wrap_malloc calls the real allocator, updates a PID-local table, appends a sequenced event row, Rust reads complete rows, HeapTimeline ingests a verified prefix and final assembly records a lifetime.</desc>
