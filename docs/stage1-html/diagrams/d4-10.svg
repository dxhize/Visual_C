<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 610" role="img" aria-labelledby="t desc"><title id="t">Walkthrough 10: fork and heap coverage</title><desc id="desc">Fork resets child allocator state; parent and logged child append PID-local events and ACKs. The parser verifies observed PIDs and followed inferior, while silent descendants remain unknown.</desc>
