<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="t desc"><title id="t">Walkthrough E: declaration metadata bridge</title><desc id="desc">Dwarf extraction indexes a GCC declaration, optional Clang AST describes source syntax, evidence fusion uses CU and declaration identity to propose bounded links, and final trace retains unresolved/candidate status.</desc>
